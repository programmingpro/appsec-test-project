services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: py-worker
    environment:
      - SERVER_URL=http://31.130.130.186:5000
      - DISPLAY=${DISPLAY:-:0}
      - POLL_INTERVAL=2
    volumes:
      - /:/host
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
